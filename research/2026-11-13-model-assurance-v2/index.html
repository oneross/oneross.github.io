<script>
(function () {
  var P = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("gate"), pw = document.getElementById("pw"), btn = document.getElementById("go"), err = document.getElementById("err");
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  if (!(window.crypto && crypto.subtle)) { err.textContent = "This browser cannot decrypt here.  Open the page over HTTPS in a current browser."; btn.disabled = true; return; }
  async function unlock(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
    if (P.gz) {
      if (!("DecompressionStream" in window)) throw new Error("nodecompress");
      plain = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    }
    return new TextDecoder().decode(plain);
  }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true; err.textContent = ""; btn.textContent = "Unlocking\u2026";
    try {
      var html = await unlock(pw.value);
      pw.value = "";
      document.open(); document.write(html); document.close();
    } catch (x) {
      err.textContent = x && x.message === "nodecompress" ? "This browser is too old to open this page." : "Wrong password.";
      btn.disabled = false; btn.textContent = "Unlock"; pw.select();
    }
  });
})();
</script>
